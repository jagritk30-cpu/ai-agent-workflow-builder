table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
array_relationships:
  - name: workflow_results
    using:
      foreign_key_constraint_on:
        column: step_run_id
        table:
          name: workflow_results
          schema: public
select_permissions:
  - role: owner
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow_run.org_id
      columns: "*"
  - role: editor
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow_run.org_id
      columns: "*"
  - role: viewer
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow_run.org_id
      columns: "*"
insert_permissions:
  - role: owner
    permission:
      check:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $body.workflow_run.org_id
              - role:
                  _in:
                    - owner
      columns: "*"
  - role: editor
    permission:
      check:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $body.workflow_run.org_id
      columns: "*"
update_permissions:
  - role: owner
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow_run.org_id
              - role:
                  _in:
                    - owner
      check: {}
      columns: "*"
  - role: editor
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow_run.org_id
      check: {}
      columns: "*"
delete_permissions:
  - role: owner
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow_run.org_id
              - role:
                  _in:
                    - owner
  - role: editor
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow_run.org_id
