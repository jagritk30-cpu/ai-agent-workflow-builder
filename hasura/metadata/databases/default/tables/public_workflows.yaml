table:
  name: workflows
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: workflow_steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: workflow_triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
select_permissions:
  - role: owner
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.org_id
      columns: "*"
      allow_aggregations: true
  - role: editor
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.org_id
      columns: "*"
      allow_aggregations: true
  - role: viewer
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.org_id
      columns: "*"
insert_permissions:
  - role: owner
    permission:
      check:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $body.org_id
              - role:
                  _in:
                    - owner
      columns: "*"
  - role: editor
    permission:
      check:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $body.org_id
      columns: "*"
update_permissions:
  - role: owner
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.org_id
              - role:
                  _in:
                    - owner
      check: {}
      columns: "*"
  - role: editor
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.org_id
      check: {}
      columns:
        - name
        - description
        - is_active
        - updated_at
delete_permissions:
  - role: owner
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.org_id
              - role:
                  _in:
                    - owner
event_triggers:
  - name: workflow_updated
    definition:
      enable_manual: false
      update:
        columns: "*"
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: "{{HASURA_ACTION_BASE_URL}}/api/actions/notify-handler"
