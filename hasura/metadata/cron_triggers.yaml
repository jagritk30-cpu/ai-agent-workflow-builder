- name: scheduled_runner
  webhook: "{{HASURA_ACTION_BASE_URL}}/api/actions/scheduled-runner"
  schedule: "* * * * *"
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 0
    timeout_seconds: 60
    tolerance_seconds: 21600
    retry_interval_seconds: 10
  comment: "Runs every minute to trigger scheduled workflows"
