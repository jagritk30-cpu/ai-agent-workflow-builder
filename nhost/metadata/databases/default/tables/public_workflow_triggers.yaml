table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: owner
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow.org_id
      columns: "*"
  - role: editor
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow.org_id
      columns: "*"
  - role: viewer
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow.org_id
      columns: "*"
insert_permissions:
  - role: owner
    permission:
      check:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $body.workflow.org_id
              - role:
                  _in:
                    - owner
      columns: "*"
  - role: editor
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: org_members
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - org_id:
                      _eq: $body.workflow.org_id
          - trigger_type:
              _neq: webhook
      columns: "*"
update_permissions:
  - role: owner
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow.org_id
              - role:
                  _in:
                    - owner
      check: {}
      columns: "*"
  - role: editor
    permission:
      filter:
        _and:
          - _exists:
              _table:
                name: org_members
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - org_id:
                      _eq: $table.workflow.org_id
          - trigger_type:
              _neq: webhook
      check: {}
      columns: "*"
delete_permissions:
  - role: owner
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow.org_id
              - role:
                  _in:
                    - owner
  - role: editor
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: $table.workflow.org_id
